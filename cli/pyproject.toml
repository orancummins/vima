[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ofin"
version = "0.1.0"
description = "Standalone CLI + SDK for Mastercard Open Finance (US, AU, EU)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.28",
    "cryptography>=41.0",
]

[project.scripts]
ofin = "ofin.cli:main"

[tool.setuptools]
packages = ["ofin", "ofin.sdk", "ofin.sdk._vendor", "ofin.commands"]
