# tests/test_config.example.ini
# Copy this file to tests/test_config.ini (gitignored) and fill in your values.
# The test dashboard will send email notifications after each test run.

[email]
# SMTP server hostname
smtp_host = smtp.office365.com

# SMTP port. Common values: 587 (STARTTLS), 465 (SSL), 25 (plain)
smtp_port = 587

# Whether to use STARTTLS (1 = yes, 0 = no). Recommended for port 587.
use_tls = 1

# SMTP login credentials
smtp_user = your-username@your-domain.com
smtp_password = your-app-password-here

# Sender address shown in the From: header.
# Leave blank to use smtp_user.
from_address =

# Comma-separated list of recipient addresses.
to_addresses = your-team@your-domain.com
