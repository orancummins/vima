<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance In Colour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070a12; overflow: hidden;
                 font-family: 'Inter', system-ui, sans-serif; }
    #fic-canvas { position: fixed; inset: 0; display: block; }
    #fic-hud {
      position: fixed; inset: 0; pointer-events: none; display: none;
      flex-direction: column; justify-content: space-between; padding: 20px 24px;
    }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .hud-title { font-size: 17px; font-weight: 700; color: rgba(255,255,255,.88);
                 letter-spacing: -.01em; }
    .hud-sub   { font-size: 11px; color: rgba(255,255,255,.28); margin-top: 3px; }
    .hud-net   { text-align: right; }
    .hud-net-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
                   color: rgba(255,255,255,.28); }
    .hud-net-val { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
    .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .hud-stats  { display: flex; gap: 22px; }
    .hud-stat label { display: block; font-size: 10px; text-transform: uppercase;
                      letter-spacing: .07em; color: rgba(255,255,255,.26); }
    .hud-stat span  { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.72); }
    .hud-pill { font-size: 10px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .09em; padding: 5px 11px; border-radius: 999px; }
    .hud-pill.rising  { background: rgba(248,113,113,.1);  color: #f87171;
                        border: 1px solid rgba(248,113,113,.3); }
    .hud-pill.cooling { background: rgba(16,217,128,.09);  color: #10d980;
                        border: 1px solid rgba(16,217,128,.25); }
    .hud-pill.steady  { background: rgba(251,191,36,.09);  color: #fbbf24;
                        border: 1px solid rgba(251,191,36,.25); }
    .fic-screen {
      position: fixed; inset: 0; z-index: 20; background: #070a12;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: rgba(255,255,255,.35); font-size: 13px; gap: 14px; padding: 40px;
      text-align: center;
    }
    .fic-screen strong { color: rgba(255,255,255,.62); font-size: 15px; display: block; }
    .fic-spinner { width: 22px; height: 22px; border-radius: 50%;
                   border: 2px solid rgba(255,255,255,.08); border-top-color: #ff5f00;
                   animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Connect / Personas screen ────────────────────────────── */
    #fic-connect {
      position: fixed; inset: 0; z-index: 20; background: #070a12;
      overflow-y: auto; display: none; flex-direction: column;
      align-items: center; padding: 32px 20px 48px;
    }
    .fic-connect-inner { width: 100%; max-width: 860px; }
    .fic-connect-hero {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .fic-connect-hero-left { flex: 0 0 auto; }
    .fic-connect-hero h2 {
      font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.02em; margin-bottom: 6px;
    }
    .fic-connect-hero p { font-size: 12px; color: rgba(255,255,255,.35); line-height: 1.55; margin-bottom: 14px; max-width: 360px; }
    .fic-btn-connect {
      display: inline-flex; align-items: center; gap: 7px;
      background: #ff5f00; color: #fff; font-size: 13px; font-weight: 700;
      border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer;
      letter-spacing: .01em; transition: background .15s;
    }
    .fic-btn-connect:hover { background: #e05500; }
    .fic-btn-connect:disabled { background: rgba(255,95,0,.35); cursor: not-allowed; }
    .fic-connect-personas h3 {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: rgba(255,255,255,.28); margin-bottom: 14px;
    }
    .fic-persona-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
      gap: 12px; margin-bottom: 28px;
    }
    .fic-persona-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 14px 15px;
      transition: border-color .15s, background .15s;
    }
    .fic-persona-card { cursor: pointer; }
    .fic-persona-card:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
    .fic-persona-card.selected { border-color: #ff5f00; background: rgba(255,95,0,.09); }
    .fic-persona-card.active   { border-color: rgba(16,217,128,.5); background: rgba(16,217,128,.06); }
    .fic-persona-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .fic-persona-avatar {
      width: 32px; height: 32px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 13px;
      font-weight: 800; color: #000; flex-shrink: 0;
    }
    .fic-persona-name { font-size: 13px; font-weight: 700; color: #fff; }
    .fic-persona-role { font-size: 10.5px; color: rgba(255,255,255,.3); margin-top: 1px; }
    .fic-persona-desc { font-size: 11px; color: rgba(255,255,255,.36); line-height: 1.55; margin-bottom: 10px; }
    .fic-cred { display: flex; flex-direction: column; gap: 4px; }
    .fic-cred-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; }
    .fic-cred-row .lbl {
      min-width: 52px; color: rgba(255,255,255,.22); font-size: 9.5px;
      text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0;
    }
    .fic-cred-row code {
      background: rgba(255,255,255,.07); border-radius: 4px; padding: 1px 7px;
      font-family: 'SF Mono','Fira Code',monospace; font-size: 10.5px;
      color: rgba(255,255,255,.7); cursor: pointer; user-select: all;
      border: 1px solid rgba(255,255,255,.1); transition: background .12s;
    }
    .fic-cred-row code:hover { background: rgba(255,255,255,.14); color: #fff; }
    .fic-connect-msg {
      font-size: 12px; color: rgba(255,255,255,.35); margin-top: 6px;
      min-height: 18px; text-align: center;
    }
    .fic-hud-connect-btn {
      font-size: 10px; font-weight: 600; color: rgba(255,255,255,.3);
      background: none; border: 1px solid rgba(255,255,255,.1);
      border-radius: 5px; padding: 4px 10px; cursor: pointer;
      letter-spacing: .05em; text-transform: uppercase; transition: all .15s;
    }
    .fic-hud-connect-btn:hover { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.3); }
    #fic-tip {
      position: fixed; pointer-events: none; z-index: 50;
      background: rgba(7,10,18,.93); border: 1px solid rgba(255,255,255,.13);
      border-radius: 9px; padding: 9px 13px; font-size: 11.5px; line-height: 1.65;
      color: rgba(255,255,255,.76); backdrop-filter: blur(12px);
      white-space: nowrap; display: none;
      box-shadow: 0 6px 28px rgba(0,0,0,.6);
    }
    #fic-tip b { color: #fff; display: block; margin-bottom: 1px; font-size: 12px; }
    .tip-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
               margin-right: 5px; vertical-align: middle; }
  </style>
</head>
<body>

<div id="fic-loading" class="fic-screen">
  <div class="fic-spinner"></div>
  Painting your finances&hellip;
</div>

<!-- Connect + Personas screen -->
<div id="fic-connect">
  <div class="fic-connect-inner">
    <div class="fic-connect-hero">
      <div class="fic-connect-hero-left">
        <h2>Finance In Colour</h2>
        <p id="fic-connect-desc">Connect a bank account through Open Finance to paint your financial picture.</p>
        <button class="fic-btn-connect" id="fic-connect-btn">&#9679; Connect New Bank</button>
        <div class="fic-connect-msg" id="fic-connect-msg"></div>
      </div>
    </div>
    <div class="fic-connect-personas">
      <h3>Test Personas &mdash; FinBank Profiles A or B</h3>
      <div class="fic-persona-grid" id="fic-persona-grid"></div>
    </div>
  </div>
</div>

<canvas id="fic-canvas"></canvas>
<div id="fic-tip"></div>

<div id="fic-hud">
  <div class="hud-top">
    <div>
      <div class="hud-title">Finance In Colour</div>
      <div class="hud-sub" id="hud-sub"></div>
    </div>
    <div class="hud-net">
      <div class="hud-net-lbl">Net &middot; 90 days</div>
      <div class="hud-net-val" id="hud-net"></div>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="hud-stats" id="hud-stats"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="fic-hud-connect-btn" id="hud-connect-btn">+ Connect Bank</button>
      <div id="hud-pill" class="hud-pill"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* palette */
  const PAL = {
    "Income":"#10d980","Groceries & Dining":"#fb923c","Coffee Shops":"#fbbf24",
    "Restaurants":"#f87171","Fast Food":"#f97316","Shopping":"#f472b6",
    "Travel":"#38bdf8","Transport":"#22d3ee","Transportation":"#22d3ee","Gas":"#fde68a",
    "Entertainment":"#c084fc","Subscriptions":"#a78bfa","Utilities":"#60a5fa",
    "Bills":"#818cf8","Rent":"#94a3b8","Mortgage":"#cbd5e1",
    "Health":"#2dd4bf","Healthcare":"#2dd4bf","Insurance":"#14b8a6",
    "Education":"#a3e635","Personal Care":"#f9a8d4","Other":"#6b7280",
  };
  const catCol = n => PAL[n] || "#6b7280";
  const rgba = (hex, a) => {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  };
  const fmtM = (n, ccy) => {
    try { return new Intl.NumberFormat("en-US",{style:"currency",currency:ccy||"USD",maximumFractionDigits:0}).format(Math.abs(n)); }
    catch(_) { return "$"+Math.abs(Math.round(n)).toLocaleString(); }
  };
  const fmtDay = s => {
    if (!s) return "";
    const p = s.split("-");
    return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  };

  let _stars=null, _petalMeta=null, _particles=null;
  let _layout=null, _mouse={x:-9999,y:-9999};

  function buildPetalMeta(cats, innerR, maxLen) {
    const tot = cats.reduce((s,c)=>s+c.pct,0)||100;
    const max = (cats[0]||{}).pct||1;
    let angle = -Math.PI/2;
    return cats.map(cat => {
      const arc=(cat.pct/tot)*Math.PI*2;
      const len=Math.max(30,(cat.pct/max)*maxLen);
      const col=catCol(cat.category);
      const mid=angle+arc/2;
      const d={cat,arc,len,col,start:angle,mid};
      angle+=arc; return d;
    });
  }

  function buildParticles(meta, innerR) {
    const ps=[];
    meta.forEach(pd => {
      const n=Math.max(6,Math.round(pd.cat.pct*1.6));
      for(let i=0;i<n;i++){
        ps.push({
          a:pd.mid+(Math.random()-.5)*pd.arc*.75,
          slack:(Math.random()-.5)*pd.arc*.38,
          r:innerR+Math.random()*pd.len,
          dr:.18+Math.random()*.42,
          minR:innerR*.55, maxR:innerR+pd.len,
          col:pd.col, sz:1.4+Math.random()*2.6, ph:Math.random()*Math.PI*2,
        });
      }
    });
    return ps;
  }

  function draw(ctx, W, H, data, t) {
    const fp=data.fingerprint||{}, series=data.series||[];
    const trend=(data.trend||{}).label||"steady";
    const cats=(data.categories||[]).slice(0,10);

    ctx.fillStyle="#070a12"; ctx.fillRect(0,0,W,H);

    const bp=.5+.5*Math.sin(t/4000);
    const bg=ctx.createRadialGradient(W*.5,H*.38,0,W*.5,H*.38,W*.52);
    bg.addColorStop(0,"rgba(22,16,50,"+(.45+bp*.1)+")"); bg.addColorStop(1,"transparent");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    if(!_stars){
      _stars=Array.from({length:110},()=>({
        x:Math.random(),y:Math.random()*.70,r:.35+Math.random()*1.0,
        a:.07+Math.random()*.32,f:.18+Math.random()*.9,
      }));
    }
    _stars.forEach(s=>{
      ctx.save(); ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,"+(s.a*(.5+.5*Math.sin(t/2000*s.f+s.x*9)))+")";
      ctx.fill(); ctx.restore();
    });

    const cx=W*.5, cy=H*.37;
    const innerR=Math.min(W,H)*.052;
    const maxLen=Math.min(W*.28,H*.28);
    const tlCY=H*.735;
    const px=W*.055, tw=W*.89, th=H*.115;
    const xs=series.length>1?tw/(series.length-1):tw;
    const mxF=series.reduce((m,s)=>Math.max(m,s.in,s.out),1);
    _layout={cx,cy,innerR,maxLen,tlCY,px,tw,th,xs,mxF,series};

    if(cats.length){
      if(!_petalMeta) _petalMeta=buildPetalMeta(cats,innerR,maxLen);
      if(!_particles)  _particles=buildParticles(_petalMeta,innerR);

      _petalMeta.forEach(pd=>{
        const {start:s0,arc,len,col,mid}=pd;

        ctx.save(); ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,innerR+len,s0,s0+arc);
        ctx.arc(cx,cy,innerR,s0+arc,s0,true); ctx.closePath();
        ctx.fillStyle=rgba(col,.060); ctx.shadowColor=col; ctx.shadowBlur=38;
        ctx.fill(); ctx.restore();

        ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,innerR+len,s0,s0+arc);
        ctx.strokeStyle=rgba(col,.55); ctx.lineWidth=1.5;
        ctx.shadowColor=col; ctx.shadowBlur=20; ctx.stroke(); ctx.restore();

        ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,innerR+len*.55,s0,s0+arc);
        ctx.strokeStyle=rgba(col,.18); ctx.lineWidth=.8;
        ctx.shadowColor=col; ctx.shadowBlur=8; ctx.stroke(); ctx.restore();

        ctx.save(); ctx.beginPath();
        ctx.moveTo(cx+Math.cos(mid)*innerR,cy+Math.sin(mid)*innerR);
        ctx.lineTo(cx+Math.cos(mid)*(innerR+len),cy+Math.sin(mid)*(innerR+len));
        ctx.strokeStyle=rgba(col,.28); ctx.lineWidth=.9;
        ctx.shadowColor=col; ctx.shadowBlur=10; ctx.stroke(); ctx.restore();

        const lx=cx+Math.cos(mid)*(innerR+len+17);
        const ly=cy+Math.sin(mid)*(innerR+len+17);
        ctx.save();
        ctx.font="500 10.5px 'Inter',system-ui";
        ctx.fillStyle=rgba(col,.88);
        ctx.textAlign=Math.cos(mid)>0?"left":"right";
        ctx.textBaseline="middle"; ctx.shadowColor=col; ctx.shadowBlur=6;
        ctx.fillText(pd.cat.category,lx,ly); ctx.restore();
      });

      _particles.forEach(p=>{
        p.r+=p.dr;
        if(p.r>p.maxR) p.r=p.minR+Math.random()*innerR*.4;
        const a=p.a+p.slack*Math.sin(t/3200+p.ph);
        ctx.save(); ctx.beginPath();
        ctx.arc(cx+Math.cos(a)*p.r,cy+Math.sin(a)*p.r,p.sz,0,Math.PI*2);
        ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=14;
        ctx.fill(); ctx.restore();
      });
    }

    const sr=fp.savings_rate||0;
    const coreCol=sr>.05?"#10d980":sr<0?"#f87171":"#fbbf24";
    const pulseSpd=trend==="rising"?370:trend==="cooling"?1400:800;
    const pulse=1+.085*Math.sin(t/pulseSpd);
    const cR=innerR*pulse;

    for(let i=0;i<3;i++){
      const ph=((t/2200)+i/3)%1;
      ctx.save(); ctx.beginPath();
      ctx.arc(cx,cy,cR+ph*maxLen*.20,0,Math.PI*2);
      ctx.strokeStyle=rgba(coreCol,(1-ph)*.13); ctx.lineWidth=1.5;
      ctx.shadowColor=coreCol; ctx.shadowBlur=18; ctx.stroke(); ctx.restore();
    }

    [.04,.10,.20].forEach((a,i)=>{
      ctx.save(); ctx.beginPath();
      ctx.arc(cx,cy,cR*(1.85-i*.35),0,Math.PI*2);
      ctx.fillStyle=rgba(coreCol,a); ctx.shadowColor=coreCol; ctx.shadowBlur=55;
      ctx.fill(); ctx.restore();
    });

    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,cR,0,Math.PI*2);
    const og=ctx.createRadialGradient(cx-cR*.32,cy-cR*.32,0,cx,cy,cR);
    og.addColorStop(0,"#ffffff"); og.addColorStop(.42,coreCol); og.addColorStop(1,rgba(coreCol,.55));
    ctx.fillStyle=og; ctx.shadowColor=coreCol; ctx.shadowBlur=55;
    ctx.fill(); ctx.restore();

    ctx.save();
    const fs=Math.max(8,Math.round(cR*.52));
    ctx.font="700 "+fs+"px 'Inter',system-ui";
    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.shadowBlur=0;
    ctx.fillText((sr>=0?"+":"")+Math.round(sr*100)+"%",cx,cy); ctx.restore();

    ctx.save();
    const sg=ctx.createLinearGradient(0,0,W,0);
    sg.addColorStop(0,"transparent"); sg.addColorStop(.12,"rgba(255,255,255,.05)");
    sg.addColorStop(.88,"rgba(255,255,255,.05)"); sg.addColorStop(1,"transparent");
    ctx.strokeStyle=sg; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,tlCY); ctx.lineTo(W,tlCY);
    ctx.stroke(); ctx.restore();

    if(series.length>1){

      const fillPath=(key,above)=>{
        ctx.beginPath();
        series.forEach((s,i)=>{
          const x=px+i*xs, y=tlCY-(s[key]/mxF)*th*(above?1:-1);
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });
        ctx.lineTo(px+(series.length-1)*xs,tlCY);
        ctx.lineTo(px,tlCY); ctx.closePath();
      };
      const strokePath=(key,above)=>{
        ctx.beginPath();
        series.forEach((s,i)=>{
          const x=px+i*xs, y=tlCY-(s[key]/mxF)*th*(above?1:-1);
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });
      };

      fillPath("in",true);
      const gi=ctx.createLinearGradient(0,tlCY-th,0,tlCY);
      gi.addColorStop(0,"rgba(16,217,128,.52)"); gi.addColorStop(1,"rgba(16,217,128,.03)");
      ctx.save(); ctx.fillStyle=gi; ctx.shadowColor="#10d980"; ctx.shadowBlur=10;
      ctx.fill(); ctx.restore();
      strokePath("in",true);
      ctx.save(); ctx.strokeStyle="#10d980"; ctx.lineWidth=1.5;
      ctx.shadowColor="#10d980"; ctx.shadowBlur=14; ctx.stroke(); ctx.restore();

      fillPath("out",false);
      const go=ctx.createLinearGradient(0,tlCY,0,tlCY+th);
      go.addColorStop(0,"rgba(248,113,113,.03)"); go.addColorStop(1,"rgba(248,113,113,.46)");
      ctx.save(); ctx.fillStyle=go; ctx.shadowColor="#f87171"; ctx.shadowBlur=10;
      ctx.fill(); ctx.restore();
      strokePath("out",false);
      ctx.save(); ctx.strokeStyle="#f87171"; ctx.lineWidth=1.5;
      ctx.shadowColor="#f87171"; ctx.shadowBlur=14; ctx.stroke(); ctx.restore();

      ctx.save(); ctx.beginPath();
      ctx.moveTo(px,tlCY); ctx.lineTo(px+tw,tlCY);
      ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=1;
      ctx.stroke(); ctx.restore();

      ctx.save();
      ctx.font="10px 'Inter',system-ui"; ctx.fillStyle="rgba(255,255,255,.20)";
      ctx.textBaseline="top";
      const ly=tlCY+th+7;
      [0,Math.floor(series.length/2),series.length-1].forEach(idx=>{
        ctx.textAlign=idx===0?"left":idx===series.length-1?"right":"center";
        ctx.fillText(fmtDay(series[idx].day),px+idx*xs,ly);
      });
      ctx.restore();

      ctx.save(); ctx.font="500 10px 'Inter',system-ui"; ctx.textAlign="left";
      ctx.fillStyle="rgba(16,217,128,.48)"; ctx.textBaseline="bottom";
      ctx.fillText("\u2191 money in",px,tlCY-4);
      ctx.fillStyle="rgba(248,113,113,.48)"; ctx.textBaseline="top";
      ctx.fillText("\u2193 money out",px,tlCY+4);
      ctx.restore();

      // hover crosshair
      if(_mouse.x>=px && _mouse.x<=px+tw && Math.abs(_mouse.y-tlCY)<th+30){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(_mouse.x,tlCY-th-8); ctx.lineTo(_mouse.x,tlCY+th+8);
        ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1;
        ctx.setLineDash([3,4]); ctx.stroke(); ctx.restore();
      }
    }
  }

  /* ── Test Personas ───────────────────────────────────────────── */
  const PERSONAS = [
    { name:"Sue",       role:"Product Manager",
      username:"sue_wealthy",      password:"profile_700",
      desc:"Steady income · mortgage · multiple investments · travels · car lease",
      color:"#10d980" },
    { name:"Francis",   role:"Restaurant Owner",
      username:"francis_business", password:"profile_701",
      desc:"Profitable business · multiple checking accounts · loan accounts",
      color:"#38bdf8" },
    { name:"Joe",       role:"Creative Designer / Gig",
      username:"joe_gig",          password:"profile_702",
      desc:"Variable income via Zelle · rents · no investments · some savings",
      color:"#c084fc" },
    { name:"River",     role:"Construction Worker",
      username:"river_paycheck",   password:"profile_703",
      desc:"Rents apartment · expenses sometimes exceed income · no credit cards",
      color:"#fbbf24" },
    { name:"Alex",      role:"Full-time Employee",
      username:"alex_student",     password:"profile_704",
      desc:"Student loan ($30k+) · limited savings · new investment account",
      color:"#f87171" },
  ];

  let _ficCid = null, _ficConnectWin = null, _ficSelectedPersona = null, _ficActiveName = null;

  function ficShowConnect(msg) {
    document.getElementById("fic-loading").style.display="none";
    document.getElementById("fic-hud").style.display="none";
    const conn = document.getElementById("fic-connect");
    conn.style.display="flex";
    if (typeof msg === "string" && msg) document.getElementById("fic-connect-desc").textContent = msg;
    // Render persona cards
    const grid = document.getElementById("fic-persona-grid");
    if (grid && !grid.childElementCount) {
      grid.innerHTML = PERSONAS.map((p,i) => `
        <div class="fic-persona-card" data-idx="${i}">
          <div class="fic-persona-head">
            <div class="fic-persona-avatar" style="background:${p.color}">${p.name[0]}</div>
            <div><div class="fic-persona-name">${p.name}</div><div class="fic-persona-role">${p.role}</div></div>
          </div>
          <div class="fic-persona-desc">${p.desc}</div>
          <div class="fic-cred">
            <div class="fic-cred-row"><span class="lbl">Username</span><code title="Click to copy" onclick="event.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText('${p.username}')">${p.username}</code></div>
            <div class="fic-cred-row"><span class="lbl">Password</span><code title="Click to copy" onclick="event.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText('${p.password}')">${p.password}</code></div>
          </div>
        </div>`).join("");
      // Delegated click — select a persona
      grid.addEventListener("click", function(e) {
        if (e.target.tagName === "CODE") return; // handled by copy onclick
        const card = e.target.closest(".fic-persona-card");
        if (!card) return;
        const idx = parseInt(card.dataset.idx, 10);
        _ficSelectedPersona = PERSONAS[idx];
        grid.querySelectorAll(".fic-persona-card").forEach((c, j) => {
          c.classList.toggle("selected", j === idx);
          c.classList.remove("active");
        });
        _ficActiveName = null; // selection overrides active
        const btn = document.getElementById("fic-connect-btn");
        if (btn) { btn.disabled = false; btn.textContent = "Connect as " + _ficSelectedPersona.name; }
      });
    }
    // Re-apply selection / active highlights
    if (grid) {
      grid.querySelectorAll(".fic-persona-card").forEach((c, i) => {
        const isActive   = _ficActiveName   && PERSONAS[i].name === _ficActiveName;
        const isSelected = _ficSelectedPersona && PERSONAS[i].username === _ficSelectedPersona.username;
        c.classList.toggle("active",   isActive);
        c.classList.toggle("selected", isSelected && !isActive);
      });
    }
    const btn = document.getElementById("fic-connect-btn");
    if (btn) {
      btn.onclick  = ficStartConnect;
      btn.disabled = false;
      if (_ficSelectedPersona && !_ficActiveName)
        btn.textContent = "Connect as " + _ficSelectedPersona.name;
      else if (_ficActiveName)
        btn.textContent = "Switch Bank";
      else
        btn.textContent = "Connect New Bank";
    }
    const msgEl = document.getElementById("fic-connect-msg");
    if (msgEl) msgEl.textContent = "";
  }

  function ficStartConnect() {
    const btn = document.getElementById("fic-connect-btn");
    const msgEl = document.getElementById("fic-connect-msg");
    if (btn) btn.disabled = true;
    if (msgEl) msgEl.textContent = "Creating customer\u2026";

    fetch("/usecases/financeincolour/action", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action:"create_customer",params:{}}),
    }).then(r=>r.json()).then(res => {
      if (!res || res.error || !res.customer_id) throw new Error(res&&res.error?res.error:"Could not create customer");
      _ficCid = String(res.customer_id);
      if (msgEl) msgEl.textContent = "Customer " + _ficCid + " \u00b7 generating connect URL\u2026";
      return fetch("/usecases/financeincolour/action", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"connect_url",params:{customer_id:_ficCid}}),
      }).then(r=>r.json());
    }).then(res => {
      if (!res || res.error || !res.connect_url) throw new Error(res&&res.error?res.error:"Could not generate Connect URL");
      ficOpenPopup(res.connect_url);
      if (msgEl) {
        if (_ficSelectedPersona) {
          msgEl.innerHTML = 'In the popup, search <b>FinBank Profile A</b> or <b>B</b> and sign in as <b>' +
            _ficSelectedPersona.name + '</b> using <code>' + _ficSelectedPersona.username +
            '</code> / <code>' + _ficSelectedPersona.password + '</code>';
        } else {
          msgEl.textContent = "Complete the bank flow in the popup, then wait\u2026";
        }
      }
      // Kick off a background refresh so transactions ingest faster, then poll.
      fetch("/usecases/financeincolour/action", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"refresh_accounts",params:{customer_id:_ficCid}}),
      }).catch(()=>{});
      ficPollForAccounts(_ficCid);
    }).catch(e => {
      if (btn) btn.disabled = false;
      if (msgEl) msgEl.textContent = "Error: " + e.message;
    });
  }

  function ficOpenPopup(url) {
    const w=480, h=760;
    const left = Math.max(0, window.screenX+(window.outerWidth-w)/2);
    const top  = Math.max(0, window.screenY+(window.outerHeight-h)/2);
    _ficConnectWin = window.open(url, "fic-connect",
      `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);
    if (_ficConnectWin) {
      try { _ficConnectWin.focus(); } catch(_){}
    } else {
      // Popup blocked — show a direct link
      const msgEl = document.getElementById("fic-connect-msg");
      if (msgEl) msgEl.innerHTML = 'Pop-up blocked. <a href="' + url + '" target="_blank" style="color:#ff5f00">Open connect page ↗</a>';
    }
  }

  function ficPollForAccounts(cid, tries) {
    tries = (tries === undefined) ? 50 : tries;  // 50 × 3s = 2.5 min
    const msgEl = document.getElementById("fic-connect-msg");
    const total = 50;
    fetch(`/usecases/financeincolour/data?customer_id=${encodeURIComponent(cid)}`)
      .then(r=>r.json())
      .then(d => {
        // Empty accounts → backend returns {error, pending:true}. Keep polling.
        if ((d.error || (d.accounts && d.accounts.length === 0)) && tries > 1) {
          const elapsed = total - tries + 1;
          if (msgEl) msgEl.textContent = "Linking your bank\u2026 (" + elapsed + "/" + total + ")";
          // Periodically re-trigger refresh to nudge transactions in.
          if (elapsed % 5 === 0) {
            fetch("/usecases/financeincolour/action", {
              method:"POST", headers:{"Content-Type":"application/json"},
              body: JSON.stringify({action:"refresh_accounts",params:{customer_id:cid}}),
            }).catch(()=>{});
          }
          setTimeout(()=>ficPollForAccounts(cid, tries-1), 3000);
          return;
        }
        if (d.error) {
          const btn=document.getElementById("fic-connect-btn");
          if (btn) { btn.disabled=false; }
          if (msgEl) {
            msgEl.innerHTML = "Could not load data: " + d.error + ' &middot; <a href=\"#\" id=\"fic-retry-link\" style=\"color:#ff5f00\">retry</a>';
            const rl = document.getElementById("fic-retry-link");
            if (rl) rl.onclick = (ev) => { ev.preventDefault(); ficPollForAccounts(cid); };
          }
          return;
        }
        if (_ficConnectWin) try { _ficConnectWin.close(); } catch(_){}
        start(d);
      })
      .catch(()=>{ if (tries>1) setTimeout(()=>ficPollForAccounts(cid,tries-1),3000); });
  }

  function showErr(msg){
    ficShowConnect();
    if (typeof msg === "string" && msg) {
      const el = document.getElementById("fic-connect-msg");
      if (el) el.textContent = msg;
    }
  }

  function start(data){
    // Track which persona is now active
    if (!_ficActiveName) {
      const matched = PERSONAS.find(p => data.customer_name &&
        data.customer_name.toLowerCase().includes(p.name.toLowerCase()));
      _ficActiveName = (matched || _ficSelectedPersona || {}).name || null;
    }
    const fp=data.fingerprint||{}, s=data.summary||{};
    const ccy=data.currency||"USD";
    const trend=(data.trend||{}).label||"steady";

    const custLabel = [data.customer_name, data.customer_id ? "#"+data.customer_id : null]
      .filter(Boolean).join(" · ");
    document.getElementById("hud-sub").textContent = (custLabel ? custLabel+" · " : "") + "last 90 days";

    const net=s.net||0;
    const netEl=document.getElementById("hud-net");
    netEl.textContent=(net>=0?"+":"\u2212")+fmtM(net,ccy);
    netEl.style.color=net>=0?"#10d980":"#f87171";

    document.getElementById("hud-stats").innerHTML=[
      {l:"Money In",  v:fmtM(s.total_in||0,ccy)},
      {l:"Money Out", v:fmtM(s.total_out||0,ccy)},
      {l:"Txns / Day",v:(fp.txn_per_day||0).toFixed(1)},
      {l:"Categories",v:fp.diversity||0},
    ].map(x=>"<div class=\"hud-stat\"><label>"+x.l+"</label><span>"+x.v+"</span></div>").join("");

    const pill=document.getElementById("hud-pill");
    pill.textContent=trend; pill.className="hud-pill "+trend;

    const canvas=document.getElementById("fic-canvas");
    const ctx=canvas.getContext("2d");

    function resize(){
      const dpr=window.devicePixelRatio||1;
      canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
      canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
      _petalMeta=null; _particles=null;
    }
    resize();
    window.addEventListener("resize",resize);

    // ── Tooltip hit-testing ────────────────────────────────────────────
    const tip=document.getElementById("fic-tip");
    function showTip(ex,ey,html){
      tip.innerHTML=html; tip.style.display="block";
      const tx=Math.min(ex+14,window.innerWidth-tip.offsetWidth-10);
      const ty=Math.min(ey+14,window.innerHeight-tip.offsetHeight-10);
      tip.style.left=tx+"px"; tip.style.top=ty+"px";
    }
    canvas.addEventListener("mousemove",function(e){
      const rect=canvas.getBoundingClientRect();
      _mouse.x=e.clientX-rect.left; _mouse.y=e.clientY-rect.top;
      if(!_layout||!_petalMeta){tip.style.display="none";return;}
      const {cx:lcx,cy:lcy,innerR:lR,maxLen:lMax,tlCY:ltl,px:lpx,tw:ltw,th:lth,xs:lxs,series:lser}=_layout;
      const dx=_mouse.x-lcx, dy=_mouse.y-lcy, dist=Math.sqrt(dx*dx+dy*dy);
      // core orb
      if(dist<lR*1.2){
        const sr=fp.savings_rate||0, nv=s.net||0;
        showTip(e.clientX,e.clientY,
          "<b>Financial Core</b>"
          +"Savings rate: "+(sr>=0?"+":"")+Math.round(sr*100)+"%<br>"
          +"Net 90d: "+(nv>=0?"+":"\u2212")+fmtM(Math.abs(nv),ccy));
        return;
      }
      // petal
      if(dist>=lR*.7 && dist<=lR+lMax+20){
        const angle=Math.atan2(dy,dx);
        for(const pd of _petalMeta){
          let a=angle;
          while(a<pd.start-Math.PI) a+=Math.PI*2;
          while(a>pd.start+Math.PI) a-=Math.PI*2;
          if(a>=pd.start && a<=pd.start+pd.arc && dist<=lR+pd.len+15){
            const c=pd.cat;
            showTip(e.clientX,e.clientY,
              "<span class='tip-dot' style='background:"+pd.col+"'></span>"
              +"<b>"+c.category+"</b>"
              +fmtM(c.amount,ccy)+" &middot; "+c.pct.toFixed(1)+"% of spend");
            return;
          }
        }
      }
      // timeline
      if(lser&&lser.length>1&&_mouse.x>=lpx&&_mouse.x<=lpx+ltw&&Math.abs(_mouse.y-ltl)<lth+30){
        const idx=Math.max(0,Math.min(lser.length-1,Math.round((_mouse.x-lpx)/lxs)));
        const d=lser[idx];
        showTip(e.clientX,e.clientY,
          "<b>"+fmtDay(d.day)+"</b>"
          +"\u2191 In: "+fmtM(d.in,ccy)+"<br>"
          +"\u2193 Out: "+fmtM(d.out,ccy)+"<br>"
          +"Net: "+(d.net>=0?"+":"\u2212")+fmtM(Math.abs(d.net),ccy));
        return;
      }
      tip.style.display="none";
    });
    canvas.addEventListener("mouseleave",function(){
      _mouse={x:-9999,y:-9999}; tip.style.display="none";
    });

    document.getElementById("fic-loading").style.display="none";
    document.getElementById("fic-connect").style.display="none";
    document.getElementById("fic-hud").style.display="flex";

    const hudConnBtn=document.getElementById("hud-connect-btn");
    if(hudConnBtn) hudConnBtn.onclick=()=>ficShowConnect();

    (function loop(){
      requestAnimationFrame(loop);
      const dpr=window.devicePixelRatio||1;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      draw(ctx,innerWidth,innerHeight,data,Date.now());
    })();
  }

  // Always land on the connect screen — canvas loads only after a successful bank connection.
  ficShowConnect();


})();
</script>
</body>
</html>
