<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mastercard Solution Studio</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #0f0a00 60%, #1a0f00 100%);
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: pgFadeIn 0.35s ease both;
    }
    @keyframes pgFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top accent line */
    .accent-bar {
      height: 3px;
      background: linear-gradient(90deg, transparent, #eb6200, transparent);
      flex-shrink: 0;
    }

    /* Main centred layout */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      position: relative;
    }

    .inner {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 1000px;
    }

    /* ── Left: text block ── */
    .text-block {
      flex: 1;
      min-width: 0;
      padding-right: 48px;
      animation: fadeSlideIn 1s ease-out both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateX(-28px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .mc-logo {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 28px;
    }
    .mc-logo .circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }
    .mc-logo .circle-red  { background: #eb001b; opacity: 0.92; }
    .mc-logo .circle-yel  { background: #f79e1b; opacity: 0.92; margin-left: -15px; }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,150,60,0.7);
      font-weight: 500;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
    }

    h1 .label-word {
      display: block;
      font-size: 0.38em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.3em;
    }

    h1 .gradient-word {
      background: linear-gradient(100deg, #ff6a00 0%, #ffb347 60%, #ffd280 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.7;
      max-width: 330px;
      margin-bottom: 40px;
    }

    /* CTA buttons */
    .cta-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(0); }

    .cta--primary {
      background: #ff5f00;
      color: #fff;
      border: none;
      box-shadow: 0 4px 20px rgba(255,95,0,0.35);
    }
    .cta--primary:hover { opacity: 0.9; box-shadow: 0 6px 28px rgba(255,95,0,0.5); }

    .cta--secondary {
      background: transparent;
      color: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .cta--secondary:hover {
      border-color: rgba(255,95,0,0.5);
      color: #fff;
      background: rgba(255,95,0,0.06);
    }

    .cta-icon { font-size: 16px; line-height: 1; }

    /* ── Right: globe canvas ── */
    .globe-wrap {
      flex-shrink: 0;
      position: relative;
      animation: fadeIn 1.2s ease-out both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .globe-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      filter: blur(48px);
      opacity: 0.5;
      background: radial-gradient(circle, rgba(255,98,0,0.35) 0%, rgba(255,98,0,0) 70%);
      pointer-events: none;
    }

    canvas#globe {
      position: relative;
      z-index: 10;
      display: block;
      max-width: 90vmin;
      height: auto;
    }

    /* Bottom accent line */
    .bottom-bar {
      height: 1px;
      background: rgba(255,255,255,0.04);
      flex-shrink: 0;
    }

    /* ── Page transition ── */
    body { transition: opacity 0.3s ease, transform 0.3s ease; }
    body.pg-leaving {
      opacity: 0;
      transform: translateY(-18px);
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>

  <main class="stage">
    <div class="inner">
      <!-- Left: text -->
      <div class="text-block">
        <div class="mc-logo">
          <div class="circle circle-red"></div>
          <div class="circle circle-yel"></div>
        </div>

        <div class="eyebrow">Mastercard</div>

        <h1>
          <span class="label-word">Solution</span>
          <span class="gradient-word">Studio</span>
        </h1>

        <p class="tagline">
          A unified platform for exploring, showcasing and innovating
          across Mastercard APIs and use cases.
        </p>

        <div class="cta-group">
          <a href="/app?tab=apis" class="cta cta--primary">Try APIs</a>
          <a href="/app?tab=usecases" class="cta cta--secondary">Browse Use Cases</a>
        </div>
      </div>

      <!-- Right: globe -->
      <div class="globe-wrap">
        <div class="globe-glow"></div>
        <canvas id="globe" width="820" height="820"></canvas>
      </div>
    </div>
  </main>

  <div class="bottom-bar"></div>

  <script>
    // CTA transition
    document.querySelectorAll('.cta').forEach(function(a) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        var href = this.href;
        document.body.classList.add('pg-leaving');
        setTimeout(function() { window.location.href = href; }, 290);
      });
    });
  </script>

  <script>
    (function () {
      const canvas = document.getElementById('globe');
      const ctx = canvas.getContext('2d');
      const SIZE = 820;
      const RADIUS = SIZE * 0.32;
      const CX = SIZE / 2, CY = SIZE / 2;
      const SPEED = 0.003;
      const TOTAL_DOTS = 80;

      // Fibonacci sphere points
      const pts = [];
      for (let i = 0; i < TOTAL_DOTS; i++) {
        const phi = Math.acos(-1 + (2 * i) / TOTAL_DOTS);
        const theta = Math.sqrt(TOTAL_DOTS * Math.PI) * phi;
        pts.push({
          x: Math.cos(theta) * Math.sin(phi),
          y: Math.sin(theta) * Math.sin(phi),
          z: Math.cos(phi),
        });
      }

      let rot = 0, last = null;

      function render(ts) {
        const delta = last ? Math.min((ts - last) / 16.667, 2) : 1;
        last = ts;
        ctx.clearRect(0, 0, SIZE, SIZE);

        // Glow background
        const grd = ctx.createRadialGradient(CX, CY, RADIUS * 0.2, CX, CY, RADIUS);
        grd.addColorStop(0, 'rgba(255,140,0,0.18)');
        grd.addColorStop(0.45, 'rgba(255,94,0,0.10)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(CX, CY, RADIUS * 1.35, 0, Math.PI * 2);
        ctx.fill();

        // Grid lines
        const gOpacity = 0.18;
        ctx.lineWidth = 0.8;

        for (let lat = -80; lat <= 80; lat += 20) {
          const lR = (lat * Math.PI) / 180;
          for (let seg = 0; seg < 360; seg += 4) {
            const l0 = ((seg * Math.PI) / 180) + rot;
            const l1 = (((seg + 4) * Math.PI) / 180) + rot;
            const z0 = Math.cos(lR) * Math.sin(l0);
            const z1 = Math.cos(lR) * Math.sin(l1);
            const a = gOpacity * Math.max(0, Math.min(1, ((z0 + z1) / 2 + 0.4) / 0.8));
            if (a < 0.005) continue;
            const s0 = 1 / (1.8 - z0), s1 = 1 / (1.8 - z1);
            ctx.strokeStyle = `rgba(255,120,0,${a})`;
            ctx.beginPath();
            ctx.moveTo(CX + Math.cos(lR) * Math.cos(l0) * RADIUS * s0, CY + Math.sin(lR) * RADIUS * s0);
            ctx.lineTo(CX + Math.cos(lR) * Math.cos(l1) * RADIUS * s1, CY + Math.sin(lR) * RADIUS * s1);
            ctx.stroke();
          }
        }

        for (let lon = 0; lon < 360; lon += 20) {
          for (let seg = -88; seg < 90; seg += 4) {
            const l0 = (seg * Math.PI) / 180;
            const l1 = ((seg + 4) * Math.PI) / 180;
            const lR = ((lon * Math.PI) / 180) + rot;
            const z0 = Math.cos(l0) * Math.sin(lR);
            const z1 = Math.cos(l1) * Math.sin(lR);
            const a = gOpacity * Math.max(0, Math.min(1, ((z0 + z1) / 2 + 0.4) / 0.8));
            if (a < 0.005) continue;
            const s0 = 1 / (1.8 - z0), s1 = 1 / (1.8 - z1);
            ctx.strokeStyle = `rgba(255,120,0,${a})`;
            ctx.beginPath();
            ctx.moveTo(CX + Math.cos(l0) * Math.cos(lR) * RADIUS * s0, CY + Math.sin(l0) * RADIUS * s0);
            ctx.lineTo(CX + Math.cos(l1) * Math.cos(lR) * RADIUS * s1, CY + Math.sin(l1) * RADIUS * s1);
            ctx.stroke();
          }
        }

        // Dots
        const projected = pts.map(p => {
          const rx = p.x * Math.cos(rot) - p.z * Math.sin(rot);
          const rz = p.x * Math.sin(rot) + p.z * Math.cos(rot);
          const sc = 1 / (1.8 - rz);
          const fade = Math.max(0, Math.min(1, (rz + 0.2) / 0.4));
          return { px: CX + rx * RADIUS * sc, py: CY + p.y * RADIUS * sc, rz, sc, alpha: 0.15 + fade * 0.85 };
        });

        projected
          .filter(p => p.rz > -0.18)
          .sort((a, b) => a.rz - b.rz)
          .forEach(p => {
            ctx.save();
            ctx.shadowColor = 'rgba(255,140,0,0.95)';
            ctx.shadowBlur = 8 * p.sc;
            ctx.fillStyle = `rgba(255,160,40,${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.px, p.py, 2.5 * p.sc, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

        rot += SPEED * delta;
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
