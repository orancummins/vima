  <g filter="url(#panelShadow)">
    <rect x="340" y="37" width="480" height="674" rx="14" fill="url(#panelTop)" stroke="#80573C"/>
  </g>

  <text x="385" y="60" fill="#A86439" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">‹ ›</text>
  <text x="412" y="61" fill="#F0F0F0" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">View Code</text>
  <rect x="492" y="44" width="98" height="18" rx="4" fill="#6B452B"/>
  <text x="502" y="57" fill="#F8BE74" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">OPEN FINANCE US</text>
  <text x="791" y="59" fill="#84848A" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="16">×</text>
  <line x1="340" y1="74.5" x2="820" y2="74.5" stroke="#2B2B32"/>

  <text x="385" y="133" fill="#706F75" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">POST · CREATE ACCESS TOKEN</text>
  <text x="653" y="133" fill="#A6A6AC" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Copy code</text>
  <rect x="714" y="120" width="94" height="22" rx="4" fill="url(#greenBtn)" stroke="#6CCD8A"/>
  <path d="M727 126L727 136L736 131L727 126Z" fill="#EAFCEF"/>
  <text x="740" y="135" fill="#F3FFF6" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Run in terminal</text>

  <rect x="385" y="148" width="390" height="548" rx="6" fill="#0B0F13" stroke="#1C232B"/>
  <text x="396" y="177" fill="#8BBF8D" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"""</text>
  <text x="399" y="191" fill="#97F3B4" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">open_finance — Create Access Token</text>

  <text x="399" y="220" fill="#A9EAB9" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Open Finance (Finicity) uses partner-scoped App + Customer</text>
  <text x="399" y="236" fill="#A9EAB9" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Bearer tokens rather than OAuth1 signing. This snippet shows</text>
  <text x="399" y="252" fill="#A9EAB9" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">the token-exchange step — see the docs for the per-endpoint</text>
  <text x="399" y="268" fill="#A9EAB9" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">paths and Customer-scoped flows.</text>

  <text x="421" y="299" fill="#B8FDD9" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">https://developer.mastercard.com/open-finance-us/documentation/</text>
  <text x="399" y="329" fill="#CFE7CA" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Install:</text>
  <text x="421" y="350" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">pip install requests</text>
  <text x="399" y="395" fill="#CFE7CA" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Run:</text>
  <text x="421" y="413" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">export OPEN_FINANCE_PARTNER_ID="..."</text>
  <text x="421" y="429" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">export OPEN_FINANCE_PARTNER_SECRET="..."</text>
  <text x="421" y="445" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">export OPEN_FINANCE_APP_KEY="..."</text>
  <text x="421" y="461" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">python open_finance_token.py</text>

  <text x="396" y="492" fill="#E7A5FF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">import</text>
  <text x="434" y="492" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">os</text>
  <text x="396" y="508" fill="#E7A5FF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">import</text>
  <text x="434" y="508" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">requests</text>

  <text x="399" y="545" fill="#727A92" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-style="italic"># 1. Exchange partner credentials for a 2-hour App token.</text>
  <text x="399" y="563" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">app_resp = requests.post(</text>
  <text x="399" y="593" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"https://api.finicity.com/aggregation/v2/partners/authentication",</text>
  <text x="399" y="611" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">headers={</text>
  <text x="413" y="627" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"Finicity-App-Key":</text>
  <text x="544" y="627" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">os.environ["OPEN_FINANCE_APP_KEY"],</text>
  <text x="413" y="643" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"Content-Type":</text>
  <text x="526" y="643" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"application/json",</text>
  <text x="413" y="659" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"Accept":</text>
  <text x="484" y="659" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"application/json",</text>
  <text x="399" y="675" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">},</text>
  <text x="399" y="691" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">json={</text>
  <text x="413" y="707" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"partnerId":</text>
  <text x="511" y="707" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">os.environ["OPEN_FINANCE_PARTNER_ID"],</text>
  <text x="413" y="723" fill="#A4F3AF" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">"partnerSecret":</text>
  <text x="543" y="723" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">os.environ["OPEN_FINANCE_PARTNER_SECRET"],</text>
  <text x="399" y="739" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">},</text>
  <text x="399" y="755" fill="#C8CAD0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">timeout=30,</text>
</svg>
