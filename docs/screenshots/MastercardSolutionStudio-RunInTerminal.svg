<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solution Studio showing a Python snippet and a terminal window running it">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF5F00"/>
      <stop offset="1" stop-color="#FFCB05"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="120" r="180" fill="#FFCB05" fill-opacity="0.08"/>
  <circle cx="230" cy="780" r="220" fill="#FF5F00" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="88" y="86" width="1424" height="728" rx="28" fill="#F8FAFC"/>
  </g>

  <rect x="88" y="86" width="1424" height="56" rx="28" fill="#E5E7EB"/>
  <rect x="88" y="114" width="1424" height="28" fill="#E5E7EB"/>
  <circle cx="126" cy="114" r="8" fill="#FF5F57"/>
  <circle cx="150" cy="114" r="8" fill="#FEBC2E"/>
  <circle cx="174" cy="114" r="8" fill="#28C840"/>
  <text x="800" y="120" text-anchor="middle" fill="#475569" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Mastercard Solution Studio</text>

  <rect x="120" y="174" width="420" height="592" rx="24" fill="#0F172A"/>
  <text x="156" y="220" fill="#E2E8F0" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">APIs</text>
  <rect x="156" y="252" width="348" height="54" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="184" y="287" fill="#F8FAFC" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Consent Management</text>
  <rect x="156" y="330" width="348" height="54" rx="16" fill="#111827" stroke="#1F2937"/>
  <text x="184" y="365" fill="#94A3B8" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="20">Transaction Notifications</text>
  <rect x="156" y="408" width="348" height="54" rx="16" fill="#111827" stroke="#1F2937"/>
  <text x="184" y="443" fill="#94A3B8" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="20">Consumer Clarity</text>
  <rect x="156" y="486" width="348" height="54" rx="16" fill="#111827" stroke="#1F2937"/>
  <text x="184" y="521" fill="#94A3B8" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="20">Open Finance US</text>

  <rect x="574" y="174" width="520" height="592" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="614" y="220" fill="#0F172A" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Python snippet</text>
  <rect x="866" y="192" width="160" height="36" rx="18" fill="url(#accent)"/>
  <text x="946" y="215" text-anchor="middle" fill="#111827" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Run in terminal</text>
  <rect x="614" y="248" width="440" height="474" rx="18" fill="#0B1120"/>
  <text x="642" y="290" fill="#93C5FD" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">import os</text>
  <text x="642" y="326" fill="#93C5FD" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">import requests</text>
  <text x="642" y="398" fill="#C084FC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">consumer_key</text>
  <text x="792" y="398" fill="#E5E7EB" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">=</text>
  <text x="824" y="398" fill="#86EFAC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">os.environ["CONSENT_MANAGEMENT_CONSUMER_KEY"]</text>
  <text x="642" y="434" fill="#C084FC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">key_path</text>
  <text x="746" y="434" fill="#E5E7EB" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">=</text>
  <text x="778" y="434" fill="#86EFAC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">os.environ["CONSENT_MANAGEMENT_SIGNING_KEY_PATH"]</text>
  <text x="642" y="506" fill="#FCA5A5" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">response</text>
  <text x="746" y="506" fill="#E5E7EB" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">= requests.post(...)</text>
  <text x="642" y="578" fill="#FDE68A" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">print(response.status_code)</text>
  <text x="642" y="614" fill="#FDE68A" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">print(response.text)</text>

  <g filter="url(#shadow)">
    <rect x="1036" y="258" width="400" height="350" rx="22" fill="#0B1020" stroke="#263244"/>
  </g>
  <rect x="1036" y="258" width="400" height="38" rx="22" fill="#111827"/>
  <rect x="1036" y="280" width="400" height="16" fill="#111827"/>
  <circle cx="1064" cy="277" r="6" fill="#FF5F57"/>
  <circle cx="1084" cy="277" r="6" fill="#FEBC2E"/>
  <circle cx="1104" cy="277" r="6" fill="#28C840"/>
  <text x="1236" y="281" text-anchor="middle" fill="#E5E7EB" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Terminal</text>

  <text x="1062" y="336" fill="#86EFAC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$ export CONSENT_MANAGEMENT_...</text>
  <text x="1062" y="372" fill="#86EFAC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$ python3 -m pip install requests</text>
  <text x="1062" y="408" fill="#86EFAC" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$ python3 consent_management.py</text>
  <text x="1062" y="462" fill="#93C5FD" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">Mastercard Solution Studio</text>
  <text x="1062" y="496" fill="#E5E7EB" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">status: 200</text>
  <text x="1062" y="530" fill="#E5E7EB" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">{"success": true, "consentId": "..."}</text>
  <text x="1062" y="578" fill="#FDE68A" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">Press Enter to close...</text>

  <path d="M1016 418C981 418 972 418 944 418" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M955 399L1013 418L955 437" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="120" y="852" fill="#CBD5E1" font-family="SF Pro Display, Segoe UI, Arial, sans-serif" font-size="24">Run authentic Python snippets directly from the APIs tab in a local terminal.</text>
</svg>
