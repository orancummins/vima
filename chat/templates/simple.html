<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vima Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #ff5f00;
      --green:  #2ea043;
      --ink:    #141414;
      --bg:     #f7f7f8;
      --card:   #ffffff;
      --line:   #e5e5e5;
      --muted:  #767676;
      --radius: 8px;
      --mono:   "JetBrains Mono", monospace;
    }

    html, body { height: 100%; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: var(--ink); background: var(--bg); overflow: hidden; }

    /* ── Layout ── */
    .chat-wrap { display: flex; flex-direction: column; height: 100vh; }

    /* ── Top bar ── */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 46px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }

    .path-area {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .path-icon { color: var(--muted); flex-shrink: 0; }
    .path-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    .btn-icon:hover { color: var(--ink); background: var(--bg); }

    /* type switcher */
    .type-switcher {
      display: flex;
      background: var(--bg);
      border-radius: 20px;
      padding: 2px;
      flex-shrink: 0;
    }
    .type-btn {
      padding: 5px 14px;
      border: none;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all .15s;
      white-space: nowrap;
    }
    .type-btn.active { background: var(--orange); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    /* model picker */
    .model-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .model-picker select {
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 22px 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23767676' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>") no-repeat right 6px center;
      color: var(--ink);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color .15s;
    }
    .model-picker select:hover, .model-picker select:focus { border-color: var(--orange); }
    .model-cost {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Dir edit row ── */
    .dir-edit-row {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .dir-edit-row.hidden { display: none; }
    .dir-edit-row input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
      background: var(--card);
      outline: none;
      transition: border-color .15s;
    }
    .dir-edit-row input:focus { border-color: var(--orange); }
    .btn-load {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-load:hover { background: #333; }
    .btn-load:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Item bar ── */
    .item-bar {
      flex-shrink: 0;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 8px 16px;
    }
    .item-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 30px;
    }
    .item-chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all .15s;
      white-space: nowrap;
      line-height: 1;
    }
    .item-chip:hover { border-color: var(--orange); color: var(--orange); }
    .item-chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }
    .item-chip.active:hover { opacity: .9; }
    .empty-note { font-size: 12px; color: var(--muted); font-style: italic; }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
      pointer-events: none;
    }
    .empty-state svg { opacity: .25; }
    .empty-state p { font-size: 13px; line-height: 1.5; }

    /* Message bubbles */
    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .msg-role { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 0 3px; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg.user .msg-bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant .msg-bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.done { align-items: center; justify-content: center; }
    .msg.done .msg-role { display: none; }
    .msg.done .msg-bubble { background: #edfaf3; border: 1.5px solid #22a562; color: #1a7a47; font-weight: 600; font-size: 13px; padding: 7px 18px; border-radius: 20px; text-align: center; }
    .msg-bubble p { margin-bottom: 6px; } .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble code { font-family: var(--mono); font-size: .83em; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 4px; }
    .msg.user .msg-bubble code { background: rgba(255,255,255,.15); }
    .msg-bubble pre { background: #1a1a1a; color: #e4e4e4; font-family: var(--mono); font-size: .80em; padding: 11px 13px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .msg-bubble pre code { background: none; padding: 0; color: inherit; }
    .msg-bubble strong { font-weight: 600; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }

    /* Tool rows */
    .tool-row {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 11px;
      font-size: 11.5px;
      font-family: var(--mono);
      color: var(--muted);
      max-width: 92%;
    }
    .tool-name { color: var(--orange); font-weight: 600; flex-shrink: 0; }
    .tool-args { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Done summary ── */
    .done-summary {
      align-self: flex-start;
      background: color-mix(in srgb, var(--green) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--green) 30%, transparent);
      border-radius: 8px;
      padding: 8px 14px;
      margin-top: 4px;
      max-width: 92%;
    }
    .done-badge {
      font-weight: 600;
      font-size: 12px;
      color: var(--green, #2ea043);
    }
    .done-changes {
      margin-top: 4px;
      font-size: 11.5px;
      font-family: var(--mono);
    }
    .done-change-row {
      padding: 1px 0;
      color: var(--muted);
    }
    .done-tool { color: var(--orange); font-weight: 600; }
    .done-path { color: var(--fg); }

    /* ── Status strip ── */
    .status-strip {
      flex-shrink: 0;
      height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--card);
      border-top: 1px solid transparent;
      font-size: 12px;
      color: var(--muted);
      transition: height .2s, border-color .2s;
    }
    .status-strip.working, .status-strip.done { height: 30px; border-top-color: var(--line); }
    .s-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-strip.working .s-dot { background: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
    .status-strip.done .s-dot { background: #22a562; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)} }
    .s-text { font-weight: 500; color: var(--ink); }

    /* ── Compose area ── */
    .compose-area {
      flex-shrink: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    /* Prefix bar */
    .compose-prefix-bar {
      padding: 9px 16px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
      user-select: none;
      border-bottom: 1px solid var(--line);
      transition: background .2s, color .2s;
    }
    .compose-prefix-bar.has-item { background: #fff7f2; color: #7a3c00; border-bottom-color: #ffd9be; }
    .compose-prefix-bar.has-item strong { color: var(--orange); font-weight: 600; }
    .compose-prefix-bar.placeholder { color: #bbb; background: var(--bg); font-style: italic; }

    /* Inputs */
    textarea.compose-input {
      width: 100%;
      resize: none;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      font-family: Inter, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--card);
      outline: none;
      transition: background .15s;
    }
    textarea.compose-input:focus { background: #fffbf8; }
    textarea.compose-input::placeholder { color: #c8c8c8; }


    /* Preview */
    .compose-preview-wrap {
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .preview-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .preview-text {
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
      color: #999;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
      user-select: all;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .preview-text::-webkit-scrollbar { width: 4px; }
    .preview-text::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    /* Footer */
    .compose-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
    }
    .btn-send {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity .15s;
    }
    .btn-send:hover { opacity: .88; }
    .btn-send:disabled { opacity: .35; cursor: not-allowed; }
    .btn-clear {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-clear:hover { border-color: var(--ink); color: var(--ink); }
  </style>
</head>
<body>
<div class="chat-wrap">

  <!-- Top bar: path + pencil + type switcher -->
  <header class="top-bar">
    <div class="path-area">
      <svg class="path-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M2 4.5A1.5 1.5 0 013.5 3h3l1.5 1.5H12.5A1.5 1.5 0 0114 6v5.5A1.5 1.5 0 0112.5 13h-9A1.5 1.5 0 012 11.5v-7z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
      </svg>
      <span class="path-text" id="pathDisplay">{{ vima_base }}</span>
      <button class="btn-icon" id="btnEditPath" title="Change directory" aria-label="Edit directory">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M11.5 2.5a1.414 1.414 0 012 2L5 13H3v-2L11.5 2.5z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="type-switcher">
      <button class="type-btn active" data-type="usecases" id="tabUsecases">Use Cases</button>
      <button class="type-btn" data-type="apis" id="tabApis">APIs</button>
    </div>
    <div class="model-picker" id="modelPicker">
      <select id="modelSelect" title="Loading models…"></select>
      <span class="model-cost" id="modelCost"></span>
    </div>
  </header>

  <!-- Dir edit row (hidden by default) -->
  <div class="dir-edit-row hidden" id="dirEditRow">
    <input type="text" id="dirInput" value="{{ vima_base }}" placeholder="/path/to/vima" autocomplete="off" spellcheck="false" />
    <button class="btn-load" id="btnLoad">Load</button>
  </div>

  <!-- Item chips bar -->
  <div class="item-bar">
    <div class="item-scroll" id="itemList">
      <span class="empty-note">Loading…</span>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <p>Select a Use Case or API<br>to get started</p>
    </div>
  </div>

  <!-- Status strip -->
  <div id="status-strip" class="status-strip" aria-live="polite"></div>

  <!-- Compose area -->
  <div class="compose-area">
    <div class="compose-prefix-bar placeholder" id="composePrefixBar">
      Select an item above to begin
    </div>
    <textarea class="compose-input" id="userInput" rows="3"
      placeholder="Describe the change…" disabled></textarea>
    <div class="compose-preview-wrap">
      <div class="preview-label">Full message to Claude</div>
      <div class="preview-text" id="composePreview">—</div>
    </div>
    <div class="compose-footer">
      <button class="btn-clear" id="btnClear">Clear</button>
      <button class="btn-send" id="btnSend" disabled>
        Send
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M2 8h12M9 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  /* ── URL params: allow programmatic launch ── */
  const _p        = new URLSearchParams(location.search);
  const _paramDir  = _p.get('dir');   // override base directory
  const _paramType = _p.get('type');  // 'usecases' | 'apis'
  const _paramItem = _p.get('item');  // item name to auto-select

  /* ── State ── */
  let sessionId   = crypto.randomUUID();
  let currentItem = null;
  let currentType = (_paramType === 'apis') ? 'apis' : 'usecases';
  let allItems    = { usecases: [], apis: [] };

  /* ── DOM refs ── */
  const pathDisplay  = document.getElementById('pathDisplay');
  const btnEditPath  = document.getElementById('btnEditPath');
  const dirEditRow   = document.getElementById('dirEditRow');
  const dirInput     = document.getElementById('dirInput');
  const btnLoad      = document.getElementById('btnLoad');
  const tabUsecases  = document.getElementById('tabUsecases');
  const tabApis      = document.getElementById('tabApis');
  const itemListEl   = document.getElementById('itemList');
  const messagesEl   = document.getElementById('messages');
  const emptyStateEl = document.getElementById('emptyState');
  const statusEl     = document.getElementById('status-strip');
  const prefixBarEl  = document.getElementById('composePrefixBar');
  const userInput    = document.getElementById('userInput');
  const previewEl    = document.getElementById('composePreview');
  const btnClear     = document.getElementById('btnClear');
  const btnSend      = document.getElementById('btnSend');
  const modelSelect  = document.getElementById('modelSelect');
  const modelCostEl  = document.getElementById('modelCost');

  /* ── Models ── */
  let availableModels = [];
  let selectedModelId = null;

  async function loadModels() {
    try {
      const resp = await fetch('/api/simple/models');
      const data = await resp.json();
      availableModels = data.models || [];
      selectedModelId = data.default || (availableModels[0] && availableModels[0].id);
      modelSelect.innerHTML = '';
      availableModels.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `${m.name} — ${m.tier}`;
        opt.title = `${m.blurb}\n$${m.input_per_mtok} in · $${m.output_per_mtok} out per MTok`;  
        if (m.id === selectedModelId) opt.selected = true;
        modelSelect.appendChild(opt);
      });
      modelSelect.removeAttribute('title');
      updateModelCost();
    } catch (e) {
      modelSelect.innerHTML = '<option>Sonnet (default)</option>';
    }
  }

  function updateModelCost() {
    const m = availableModels.find(x => x.id === selectedModelId);
    if (!m) { modelCostEl.textContent = ''; return; }
    modelCostEl.textContent = `$${m.input_per_mtok}↑ $${m.output_per_mtok}↓ /MTok`;  
    modelCostEl.title = m.blurb + '\nCached input is billed at ~10% of input rate.';
  }

  modelSelect.addEventListener('change', () => {
    selectedModelId = modelSelect.value;
    updateModelCost();
  });

  /* Apply type param to tabs */
  if (currentType === 'apis') {
    tabUsecases.classList.remove('active');
    tabApis.classList.add('active');
  }

  /* ── Dir edit row toggle ── */
  btnEditPath.addEventListener('click', () => {
    const nowHidden = dirEditRow.classList.toggle('hidden');
    if (!nowHidden) dirInput.focus();
  });

  /* ── Status bar ── */
  let _sTimer = null;
  function setStatus(state, text) {
    clearTimeout(_sTimer);
    statusEl.className = 'status-strip' + (state ? ' ' + state : '');
    if (state === 'working') {
      statusEl.innerHTML = `<div class="s-dot"></div><span class="s-text">${escHtml(text || 'Working\u2026')}</span>`;
    } else if (state === 'done') {
      statusEl.innerHTML = '<div class="s-dot"></div><span class="s-text">Done</span>';
      _sTimer = setTimeout(() => setStatus(''), 8000);
    } else {
      statusEl.innerHTML = '';
    }
  }

  /* ── Utilities ── */
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMd(raw) {
    let html = raw
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_, _l, code) => `<pre><code>${code.trimEnd()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>')
      .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>')
      .replace(/\n\n+/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  /* ── Load items from backend ── */
  async function loadItems() {
    const dir = dirInput.value.trim();
    if (!dir) return;
    itemListEl.innerHTML = '<span class="empty-note">\u2026</span>';
    btnLoad.textContent = '\u2026';
    btnLoad.disabled = true;
    try {
      const resp = await fetch(`/api/simple/items?dir=${encodeURIComponent(dir)}`);
      const data = await resp.json();
      if (!resp.ok) { alert(data.error || 'Failed to load'); return; }
      dirInput.value = data.base;
      pathDisplay.textContent = data.base;
      dirEditRow.classList.add('hidden');
      allItems = { usecases: data.usecases || [], apis: data.apis || [], base: data.base };
      renderItemList();
      /* Auto-select from URL param */
      if (_paramItem) {
        const list = allItems[currentType] || [];
        const found = list.find(i => i.name === _paramItem);
        if (found) selectItem(found);
      }
    } catch (e) {
      alert('Error loading items: ' + e.message);
    } finally {
      btnLoad.textContent = 'Load';
      btnLoad.disabled = false;
    }
  }

  function renderItemList() {
    itemListEl.innerHTML = '';
    const items = allItems[currentType] || [];

    /* Always-present 'New' chip */
    const newItem = { id: '__new__', name: 'New', isNew: true };
    const newChip = document.createElement('button');
    newChip.className = 'item-chip' + (currentItem && currentItem.id === '__new__' ? ' active' : '');
    newChip.textContent = '+ New';
    newChip.addEventListener('click', () => selectItem(newItem));
    itemListEl.appendChild(newChip);

    if (!items.length) {
      const note = document.createElement('span');
      note.className = 'empty-note';
      note.textContent = `No ${currentType} found`;
      itemListEl.appendChild(note);
      return;
    }
    items.forEach(item => {
      const chip = document.createElement('button');
      chip.className = 'item-chip' + (currentItem && currentItem.id === item.id ? ' active' : '');
      chip.textContent = item.name;
      chip.addEventListener('click', () => selectItem(item));
      itemListEl.appendChild(chip);
    });
  }

  function selectItem(item) {
    const type = currentType === 'usecases' ? 'usecase' : 'api';
    currentItem = { ...item, type, path: (allItems.base || dirInput.value.trim()) };
    sessionId = crypto.randomUUID();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyStateEl);
    renderItemList();
    updateCompose();
    userInput.focus();
  }

  /* ── Type tabs ── */
  [tabUsecases, tabApis].forEach(tab => {
    tab.addEventListener('click', () => {
      currentType = tab.dataset.type;
      tabUsecases.classList.toggle('active', currentType === 'usecases');
      tabApis.classList.toggle('active', currentType === 'apis');
      if (currentItem && currentItem.type !== (currentType === 'usecases' ? 'usecase' : 'api')) {
        currentItem = null;
        updateCompose();
      }
      renderItemList();
    });
  });

  btnLoad.addEventListener('click', loadItems);
  dirInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadItems(); });

  /* ── Compose ── */
  function newPrefixText() {
    return currentItem.type === 'usecase'
      ? 'Create a new Use Case which follows same format as other Use Cases called '
      : 'Create a new API following same format as other APIs called ';
  }

  function updateCompose() {
    const hasItem = !!currentItem;
    userInput.disabled = !hasItem;
    btnSend.disabled = !hasItem;

    if (hasItem && currentItem.isNew) {
      prefixBarEl.className = 'compose-prefix-bar has-item';
      prefixBarEl.innerHTML = escHtml(newPrefixText()) + '<strong>…</strong>';
      userInput.placeholder = 'Name…';
    } else if (hasItem) {
      const typeLabel = currentItem.type === 'usecase' ? 'Use Case' : 'API';
      prefixBarEl.className = 'compose-prefix-bar has-item';
      prefixBarEl.innerHTML = `Update <strong>${escHtml(currentItem.name)}</strong> ${escHtml(typeLabel)} only with the following:`;
      userInput.placeholder = 'Describe the change…';
    } else {
      prefixBarEl.className = 'compose-prefix-bar placeholder';
      prefixBarEl.innerHTML = 'Select an item above to begin';
      userInput.placeholder = 'Describe the change…';
    }
    updatePreview();
  }

  function buildMessage() {
    if (!currentItem) return '';
    const userText = userInput.value.trim();
    if (currentItem.isNew) {
      return newPrefixText() + userText;
    }
    const typeLabel = currentItem.type === 'usecase' ? 'Use Case' : 'API';
    const prefix = `Update ${currentItem.name} ${typeLabel} only with the following: `;
    return prefix + userText;
  }

  function updatePreview() {
    previewEl.textContent = buildMessage() || '\u2014';
  }

  userInput.addEventListener('input', updatePreview);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ── Messages ── */
  function ensureMessagesVisible() {
    if (emptyStateEl.parentNode === messagesEl) {
      messagesEl.removeChild(emptyStateEl);
    }
  }

  function addMsg(role, html) {
    ensureMessagesVisible();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const roleLabel = role === 'user' ? 'You' : role === 'done' ? '' : 'Claude';
    wrap.innerHTML = `<div class="msg-role">${roleLabel}</div><div class="msg-bubble">${html}</div>`;
    messagesEl.appendChild(wrap);
    scrollBottom();
    return wrap.querySelector('.msg-bubble');
  }

  function addToolRow(name, args) {
    ensureMessagesVisible();
    const el = document.createElement('div');
    el.className = 'tool-row';
    el.innerHTML = `<span class="tool-name">${escHtml(name)}</span><span class="tool-args">${escHtml(args)}</span>`;
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function addDoneSummary(changes) {
    ensureMessagesVisible();
    const el = document.createElement('div');
    el.className = 'msg done-summary';
    let html = '<div class="done-badge">✓ Complete</div>';
    if (changes.length) {
      html += '<div class="done-changes">';
      changes.forEach(c => {
        html += `<div class="done-change-row"><span class="done-tool">${escHtml(c.tool)}</span> <span class="done-path">${escHtml(c.path)}</span></div>`;
      });
      html += '</div>';
    }
    el.innerHTML = html;
    messagesEl.appendChild(el);
    scrollBottom();
  }

  /* ── SSE event handler ── */
  // Track file changes across the current response so we can summarise at the end
  const _mutatingTools = new Set(['patch_file', 'write_file', 'run_command']);

  function handleSSEEvent(data, ctx) {
    switch (data.type) {
      case 'text':
        if (!ctx.bubble) { ctx.bubble = addMsg('assistant', ''); ctx.raw = ''; }
        ctx.raw += data.content;
        ctx.bubble.innerHTML = renderMd(ctx.raw);
        setStatus('working', 'Writing\u2026');
        scrollBottom();
        break;
      case 'tool_start':
        setStatus('working', `Tool: ${data.name}`);
        break;
      case 'tool_executing':
        setStatus('working', `Running ${data.name}\u2026`);
        // Only show tool rows for mutating operations
        if (_mutatingTools.has(data.name)) {
          const path = data.input && (data.input.path || data.input.command || '');
          addToolRow(data.name, path);
          ctx.changes = ctx.changes || [];
          ctx.changes.push({ tool: data.name, path: path });
        }
        break;
      case 'tool_result':
        setStatus('working', 'Thinking\u2026');
        break;
      case 'error':
        setStatus('');
        addMsg('assistant', `<span style="color:#c44">${escHtml(data.message)}</span>`);
        updatePreview(); // unfreeze
        break;
      case 'done':
        setStatus('done');
        addDoneSummary(ctx.changes || []);
        ctx.bubble = null; ctx.raw = '';
        updatePreview(); // unfreeze
        break;
    }
  }

  /* ── Send ── */
  async function sendMessage() {
    if (!currentItem || btnSend.disabled) return;
    const userTyped = userInput.value.trim();
    if (!userTyped) return;
    const fullMessage = buildMessage();

    addMsg('user', escHtml(userTyped).replace(/\n/g, '<br>'));
    userInput.value = '';
    // Freeze preview to show the full message sent while Claude is working
    previewEl.textContent = fullMessage;
    btnSend.disabled = true;
    setStatus('working', 'Thinking\u2026');

    const ctx = { bubble: null, raw: '' };
    try {
      const resp = await fetch('/api/simple/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message: fullMessage,
          work_dir: currentItem.path,
          item_name: currentItem.name,
          item_type: currentItem.type,
          item_file: currentItem.file || null,
          model: selectedModelId,
        }),
      });

      if (!resp.ok) {
        setStatus('');
        addMsg('assistant', '<span style="color:#c44">Request failed.</span>');
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          try { handleSSEEvent(JSON.parse(line.slice(5).trim()), ctx); } catch {}
        }
      }
    } catch (err) {
      setStatus('');
      addMsg('assistant', `<span style="color:#c44">Error: ${escHtml(String(err))}</span>`);
    } finally {
      // If stream ended without a 'done' or 'error' event, clear the thinking state
      if (statusBar.classList.contains('working')) {
        setStatus('');
        addMsg('assistant', '<span style="color:#c44">Connection lost — the response stream ended unexpectedly. Check that the API key is valid.</span>');
      }
      btnSend.disabled = false;
    }
  }

  /* ── Clear ── */
  async function clearChat() {
    await fetch('/api/simple/chat/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
    sessionId = crypto.randomUUID();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyStateEl);
    setStatus('');
  }

  btnSend.addEventListener('click', sendMessage);
  btnClear.addEventListener('click', clearChat);

  /* ── Init ── */
  updateCompose();
  loadModels();
  if (_paramDir) dirInput.value = _paramDir;
  if (dirInput.value.trim()) loadItems();
</script>
</body>
</html>
